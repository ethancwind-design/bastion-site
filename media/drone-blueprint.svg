<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 931" role="img" aria-label="Blueprint drawing of a quadcopter airframe">
  <defs>
    <pattern id="g1" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#2a4a8c" stroke-width="1" opacity=".35"/></pattern>
    <pattern id="g2" width="160" height="160" patternUnits="userSpaceOnUse"><path d="M160 0H0V160" fill="none" stroke="#3c63b0" stroke-width="1.2" opacity=".45"/></pattern>
    <radialGradient id="glow" cx="50%" cy="48%" r="60%"><stop offset="0" stop-color="#16367e"/><stop offset="1" stop-color="#071a52"/></radialGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L9 5L0 9" fill="none" stroke="#bcd3ff" stroke-width="1.4"/></marker>
    <g id="prop">
      <circle r="118" fill="none" stroke="#bcd3ff" stroke-width="1.4" stroke-dasharray="6 7" opacity=".7"/>
      <path d="M0 0 C 30 -10, 80 -14, 112 -4 C 80 6, 30 8, 0 0 Z" fill="rgba(188,211,255,.10)" stroke="#e8f0ff" stroke-width="2"/>
      <path d="M0 0 C -30 10, -80 14, -112 4 C -80 -6, -30 -8, 0 0 Z" fill="rgba(188,211,255,.10)" stroke="#e8f0ff" stroke-width="2"/>
      <circle r="30" fill="#0b2564" stroke="#e8f0ff" stroke-width="2.4"/>
      <circle r="19" fill="none" stroke="#bcd3ff" stroke-width="1.6"/>
      <circle r="6" fill="#e8f0ff"/>
      <g stroke="#bcd3ff" stroke-width="1.4"><path d="M-19 0h-8M19 0h8M0-19v-8M0 19v8"/></g>
    </g>
  </defs>
  <rect width="1280" height="931" fill="url(#glow)"/>
  <rect width="1280" height="931" fill="url(#g1)"/>
  <rect width="1280" height="931" fill="url(#g2)"/>
  <rect x="28" y="28" width="1224" height="875" fill="none" stroke="#bcd3ff" stroke-width="2" opacity=".8"/>
  <rect x="40" y="40" width="1200" height="851" fill="none" stroke="#bcd3ff" stroke-width="1" opacity=".5"/>

  <!-- centre lines -->
  <g stroke="#7fa2e6" stroke-width="1.2" stroke-dasharray="22 6 4 6" opacity=".8">
    <path d="M640 70V840"/><path d="M120 450H1160"/>
  </g>

  <!-- arms -->
  <g stroke="#e8f0ff" stroke-width="2.4" fill="rgba(188,211,255,.07)" stroke-linejoin="round">
    <path d="M598 418 L 400 230 L 422 208 L 620 396 Z"/>
    <path d="M682 418 L 880 230 L 858 208 L 660 396 Z"/>
    <path d="M598 482 L 400 670 L 422 692 L 620 504 Z"/>
    <path d="M682 482 L 880 670 L 858 692 L 660 504 Z"/>
  </g>
  <g stroke="#bcd3ff" stroke-width="1.2" opacity=".85">
    <path d="M500 312 L 520 292"/><path d="M780 312 L 760 292"/><path d="M500 588 L 520 608"/><path d="M780 588 L 760 608"/>
  </g>

  <!-- rotors -->
  <use href="#prop" transform="translate(411 219) rotate(-18)"/>
  <use href="#prop" transform="translate(869 219) rotate(22)"/>
  <use href="#prop" transform="translate(411 681) rotate(30)"/>
  <use href="#prop" transform="translate(869 681) rotate(-12)"/>

  <!-- body -->
  <g stroke="#e8f0ff" stroke-width="2.6" stroke-linejoin="round">
    <rect x="566" y="364" width="148" height="172" rx="26" fill="#0b2564"/>
    <rect x="590" y="388" width="100" height="124" rx="12" fill="none" stroke-width="1.8"/>
  </g>
  <g stroke="#bcd3ff" stroke-width="1.5" fill="none">
    <rect x="606" y="410" width="68" height="40" rx="4"/>
    <path d="M612 424h56M612 436h56"/>
    <circle cx="640" cy="482" r="14"/><circle cx="640" cy="482" r="6"/>
    <path d="M590 450h-24M714 450h-24"/>
  </g>
  <!-- camera gimbal -->
  <g stroke="#e8f0ff" stroke-width="2.2" fill="#0b2564">
    <rect x="612" y="536" width="56" height="30" rx="6"/>
    <circle cx="640" cy="551" r="9" fill="none"/>
  </g>
  <!-- antennas -->
  <g stroke="#bcd3ff" stroke-width="1.8"><path d="M590 364 l -20 -44"/><path d="M690 364 l 20 -44"/></g>

  <!-- dimension: wheelbase -->
  <g stroke="#bcd3ff" stroke-width="1.4" fill="none">
    <path d="M411 219 L 869 681" stroke-dasharray="3 6" opacity=".7"/>
    <path d="M411 790 V 820 M869 790 V 820"/>
    <path d="M415 810 H 865" marker-start="url(#ar)" marker-end="url(#ar)"/>
    <path d="M1010 219 H 1040 M1010 681 H 1040"/>
    <path d="M1030 223 V 677" marker-start="url(#ar)" marker-end="url(#ar)"/>
  </g>

  <!-- callouts -->
  <g stroke="#bcd3ff" stroke-width="1.3" fill="none">
    <path d="M869 219 L 980 120 H 1120"/>
    <path d="M714 400 L 820 330 H 960" />
    <path d="M411 681 L 290 790 H 150"/>
    <path d="M612 551 L 500 760 H 330" opacity="0"/>
    <path d="M566 470 L 300 470 H 160"/>
    <path d="M422 208 L 300 110 H 150"/>
  </g>
  <g fill="#bcd3ff" font-family="'Courier New', monospace" font-size="15" letter-spacing="1.5">
    <text x="980" y="110">ROTOR ASSY &#183; 5 IN PROP</text>
    <text x="980" y="140" fill="#7fa2e6" font-size="13">BRUSHLESS MOTOR 2207</text>
    <text x="820" y="320">FLIGHT CONTROLLER STACK</text>
    <text x="820" y="350" fill="#7fa2e6" font-size="13">FC + ESC &#183; 30.5 MM MOUNT</text>
    <text x="150" y="780">CARBON ARM &#183; 4 MM</text>
    <text x="150" y="810" fill="#7fa2e6" font-size="13">REV. B &#183; CNC</text>
    <text x="160" y="460">BATTERY BAY</text>
    <text x="160" y="490" fill="#7fa2e6" font-size="13">4S 1500 MAH</text>
    <text x="150" y="100">AIRFRAME &#183; TOP VIEW</text>
    <text x="150" y="130" fill="#7fa2e6" font-size="13">SCALE 1:2</text>
    <text x="566" y="840" font-size="14">MOTOR SPACING 177 MM</text>
    <text x="1048" y="430" font-size="14">177 MM</text>
  </g>

  <text x="0" y="0" transform="translate(728 520) rotate(45)" fill="#bcd3ff" font-family="'Courier New', monospace" font-size="13" letter-spacing="1.5">WHEELBASE 250 MM</text>

  <!-- title block -->
  <g transform="translate(900 742)">
    <rect width="320" height="130" fill="#0b2564" stroke="#bcd3ff" stroke-width="1.6"/>
    <path d="M0 44H320M0 88H320M200 44V130" stroke="#bcd3ff" stroke-width="1.1"/>
    <g fill="#e8f0ff" font-family="'Courier New', monospace" letter-spacing="1.5">
      <text x="16" y="29" font-size="16">QUAD AIRFRAME STUDY</text>
      <text x="16" y="72" font-size="13" fill="#bcd3ff">DRONE CLUB @ PENN</text>
      <text x="16" y="116" font-size="13" fill="#bcd3ff">BASTION RESEARCH</text>
      <text x="214" y="72" font-size="13" fill="#bcd3ff">DWG 01</text>
      <text x="214" y="116" font-size="13" fill="#bcd3ff">REV B</text>
    </g>
  </g>
</svg>
